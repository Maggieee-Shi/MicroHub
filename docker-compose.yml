services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: microhub
      POSTGRES_PASSWORD: microhub
      POSTGRES_DB: microhub
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "microhub"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-service:
    build:
      context: ./user-service
      args:
        BUILD_TAGS: postgres
    environment:
      PORT: "8081"
      DATABASE_URL: "postgres://microhub:microhub@postgres:5432/microhub?sslmode=disable"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: ./notification-service
    environment:
      PORT: "8082"
    ports:
      - "8082:8082"

  matching-service:
    build:
      context: ./matching-service
    environment:
      PORT: "8080"
      USER_SERVICE_URL: "http://user-service:8081"
      NOTIFICATION_SERVICE_URL: "http://notification-service:8082"
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - notification-service

volumes:
  postgres-data:
