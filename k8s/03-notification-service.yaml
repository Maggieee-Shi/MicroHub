apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: microhub
spec:
  # Pinned to a single replica: this service's notification feed is
  # in-memory and per-pod, so a second replica would silently split state
  # (a GET could land on a pod that never saw the matching POST). Scaling
  # this safely would mean moving the feed to Redis or Postgres first -
  # a known, called-out limitation rather than an oversight.
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: microhub-notification-service:latest
          ports:
            - containerPort: 8082
          env:
            - name: PORT
              value: "8082"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: microhub
spec:
  selector:
    app: notification-service
  ports:
    - port: 8082
      targetPort: 8082
