apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  namespace: microhub
data:
  # DATABASE_URL is assembled from the postgres-credentials Secret at
  # container start (see the Deployment's env below) rather than hardcoded
  # here, so the password never lands in a ConfigMap.
  PORT: "8081"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: microhub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          # Built with: docker build --build-arg BUILD_TAGS=postgres -t <registry>/microhub-user-service:<tag> ./user-service
          image: microhub-user-service:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: user-service-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: microhub
spec:
  selector:
    app: user-service
  ports:
    - port: 8081
      targetPort: 8081
